 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="./main.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>Exploring the code and commit history of this website.</p>
    <div id = "stats"></div>
    <h2>Commits by time of day </h2>
    <p>
        Each circle represents a commit; its area shows the number of
        current code lines attributed to it. Hover for details, or drag
        from an empty area to select commits and compare code types.
    </p>
    <div id ="chart"></div>
    <p id="selection-count">No commits selected</p>
    <div id="language-breakdown"></div>
    <div id = "commit-tooltip" hidden></div>
</body>
</html>
